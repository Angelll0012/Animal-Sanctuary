<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./support.css">
    <title>Support</title>
</head>
<body>
    <header>
        <h1> Angel's Animal Sanctuary</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About US</a>
            <a href="support.html">Support</a>
        </nav>
    </header>

    <main>
        <section class="donation-box">
            <h2>Make a Donation</h2>
            <p>Your support helps us care for rescued animals.</p>
            <form>
                <label for="donation-amount">Donation amount</label>
                <input id="donation-amount" type="number" min="1" step="1" placeholder="$50" required>

                <label for="message">Message (optional)</label>
                <textarea id="message" rows="4" placeholder="Leave a kind note"></textarea>

                <button type="submit">Donate Now</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Angel's Animal Sanctuary</p>
    </footer>

   <script src="./script.js"></script>

</body>
</html>
